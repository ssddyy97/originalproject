spring.application.name=reserve-hub
spring.config.import=optional:file:./compose.yaml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/testdb}
spring.datasource.username=${DB_USERNAME:testuser}
spring.datasource.password=${DB_PASSWORD:${services.postgres.environment.POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.default-schema=testuser
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
